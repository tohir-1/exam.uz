<!DOCTYPE html>
<html lang="uz" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fanlar — ExamUZ</title>
  <meta name="description" content="ExamUZ fanlar: matematika, ingliz tili, dasturlash, tarix va boshqalar.">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <header class="header">
    <div class="container header-inner">
      <a href="admin.html" class="logo" title="Admin panel"><span class="logo-icon">E</span> ExamUZ</a>
      <nav class="nav" id="main-nav">
        <a href="index.html" class="nav-link">Bosh sahifa</a>
        <a href="exams.html" class="nav-link">Imtihonlar</a>
        <a href="subjects.html" class="nav-link active">Fanlar</a>
        <a href="leaderboard.html" class="nav-link">Reyting</a>
        <a href="about.html" class="nav-link">Biz haqimizda</a>
      </nav>
      <div class="header-actions">
        <button class="theme-toggle" id="theme-toggle" aria-label="Theme">☀️</button>
        <a href="login.html" class="btn btn-outline btn-sm" id="login-btn">Kirish</a>
        <a href="register.html" class="btn btn-primary btn-sm" id="register-btn">Ro‘yxatdan o‘tish</a>
        <a href="profile.html" class="btn btn-outline btn-sm" id="profile-link" style="display:none;"><span id="user-name">Profil</span></a>
        <button class="mobile-menu-btn" id="mobile-menu-btn" aria-label="Menu">☰</button>
      </div>
    </div>
  </header>

  <main class="section">
    <div class="container">
      <h1 class="section-title">Fanlar</h1>
      <p class="section-subtitle">O‘zingizga mos fanni tanlang va testlarni boshlang</p>
      <div class="grid-3" id="subjects-grid"></div>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <div class="footer-bottom">© 2026 ExamUZ. Barcha huquqlar himoyalangan.</div>
    </div>
  </footer>

  <script type="module">
    import './js/main.js';
    import { subjects } from './data/subjects.js';
    import { questions } from './data/questions.js';
    import { storage } from './js/storage.js';
    import { getDifficultyLabel } from './js/utils.js';

    const allQ = [...questions, ...(storage.get('customQuestions', []) || [])];
    const counts = {};
    allQ.forEach(q => { counts[q.subjectId] = (counts[q.subjectId] || 0) + 1; });

    const icons = {
      calculator: '🧮', languages: '🌐', 'book-open': '📖', landmark: '🏛️',
      leaf: '🌿', 'flask-conical': '🧪', atom: '⚛️', code: '💻',
      globe: '🌍', award: '🏅', car: '🚗', book: '📚', 'code-2': '⌨️',
      'file-code': '📄', palette: '🎨', braces: '{ }'
    };

    const progIds = ['programming', 'html', 'css', 'javascript'];

    document.getElementById('subjects-grid').innerHTML = subjects.map(s => {
      let avail = counts[s.id] || 0;
      if (!avail && progIds.includes(s.id)) avail = counts['informatics'] || 0;
      const linkSub = progIds.includes(s.id) ? 'informatics' : s.id;
      return `
        <a href="exams.html?subject=${linkSub}" class="card" style="text-decoration:none;color:inherit;">
          <div style="font-size:2rem;margin-bottom:10px;">${icons[s.icon] || '📘'}</div>
          <h3>${s.name}</h3>
          <p class="text-muted" style="font-size:0.9rem;margin:8px 0;">${s.description}</p>
          <div class="flex gap-2" style="flex-wrap:wrap;align-items:center;">
            <span class="badge badge-${s.difficulty}">${getDifficultyLabel(s.difficulty)}</span>
            <span class="text-muted" style="font-size:0.85rem;">${avail || s.questionsCount}+ savol</span>
          </div>
        </a>
      `;
    }).join('');
  </script>
</body>
</html>
