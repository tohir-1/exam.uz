<!DOCTYPE html>
<html lang="uz" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Xatolarim — ExamUZ</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <header class="header">
        <div class="container header-inner">
      <a href="admin.html" class="logo" title="Admin panel"><span class="logo-icon">E</span> ExamUZ</a>
      <nav class="nav" id="main-nav">
        <a href="index.html" class="nav-link">Bosh sahifa</a>
        <a href="exams.html" class="nav-link">Imtihonlar</a>
        <a href="subjects.html" class="nav-link">Fanlar</a>
        <a href="leaderboard.html" class="nav-link">Reyting</a>
        <a href="about.html" class="nav-link">Biz haqimizda</a>
      </nav>
      <div class="header-actions">
        <button class="theme-toggle" id="theme-toggle" aria-label="Theme">☀️</button>
        <a href="login.html" class="btn btn-outline btn-sm" id="login-btn">Kirish</a>
        <a href="register.html" class="btn btn-primary btn-sm" id="register-btn">Ro‘yxatdan o‘tish</a>
        <a href="profile.html" class="btn btn-outline btn-sm" id="profile-link" style="display:none;"><span id="user-name">Profil</span></a>
        <button class="mobile-menu-btn" id="mobile-menu-btn" aria-label="Menu">☰</button>
      </div>
    </div>
  </header>
  <main class="section">
    <div class="container">
      <h1 class="section-title">Xatolarim</h1>
      <p class="section-subtitle">Noto‘g‘ri javob bergan savollaringiz</p>
      <div id="mistakes-list"></div>
    </div>
  </main>
  <script type="module">
    import './js/main.js';
    import { getMistakes, removeMistake } from './js/storage.js';
    import { toast } from './js/notifications.js';

    function render() {
      const mistakes = getMistakes();
      const list = document.getElementById('mistakes-list');
      if (!mistakes.length) {
        list.innerHTML = '<p class="text-muted">Hali xato savollar yo‘q. Test ishlang!</p>';
        return;
      }
      list.innerHTML = mistakes.map(m => `
        <div class="card mb-2">
          <p><strong>${m.question}</strong></p>
          <p class="text-muted">Sizning javobingiz: ${m.options[m.selectedAnswer] || '—'}</p>
          <p style="color:var(--success)">To‘g‘ri: ${m.options[m.correctAnswer]}</p>
          <p class="text-muted">${m.explanation || ''}</p>
          <div class="flex gap-2 mt-2">
            <a href="test.html?mode=practice&count=1" class="btn btn-sm btn-outline">Qayta ishlash</a>
            <button class="btn btn-sm btn-danger" data-id="${m.questionId}">O‘chirish</button>
          </div>
        </div>
      `).join('');
      list.querySelectorAll('[data-id]').forEach(btn => {
        btn.addEventListener('click', () => {
          removeMistake(btn.dataset.id);
          toast.info('Xato o‘chirildi');
          render();
        });
      });
    }
    render();
  </script>
</body>
</html>
