<!DOCTYPE html>
<html lang="uz" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test — ExamUZ</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/test.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <header class="header">
    <div class="container header-inner">
      <a href="admin.html" class="logo"><span class="logo-icon">E</span> ExamUZ</a>
      <div class="test-header-info">
        <span id="test-mode-label">Mashq rejimi</span>
        <span id="timer-display" class="timer">--:--</span>
      </div>
      <button class="btn btn-outline btn-sm" id="finish-early-btn">Yakunlash</button>
    </div>
  </header>

  <main class="test-main">
    <div class="container">
      <div class="test-layout">
        <div class="test-content card">
          <div class="test-progress-top">
            <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
            <span id="progress-text">0 / 0</span>
          </div>

          <div id="question-area">
            <p class="text-muted" id="question-number">Savol 1</p>
            <h2 id="question-text" class="question-text">Yuklanmoqda...</h2>
            <div id="options-list" class="options-list"></div>
            <div id="feedback-area" class="feedback-area" style="display:none;"></div>
          </div>

          <div class="test-nav">
            <button class="btn btn-outline" id="prev-btn">← Oldingi</button>
            <button class="btn btn-outline" id="flag-btn">🔖 Belgilash</button>
            <button class="btn btn-primary" id="next-btn">Keyingi →</button>
          </div>
        </div>

        <aside class="test-sidebar card">
          <h4>Savollar</h4>
          <div id="question-nav" class="question-nav"></div>
          <div class="sidebar-stats">
            <div><span id="answered-count">0</span> javob berilgan</div>
            <div><span id="flagged-count">0</span> belgilangan</div>
          </div>
          <button class="btn btn-danger btn-sm" id="finish-btn" style="width:100%;margin-top:16px;">Testni yakunlash</button>
        </aside>
      </div>
    </div>
  </main>

  <script type="module">
    import './js/main.js';
    import { TestEngine, startTestFromParams } from './js/test-engine.js';
    import { formatTime } from './js/utils.js';
    import { toast } from './js/notifications.js';
    import { getExamById } from './data/exams.js';

    const params = new URLSearchParams(location.search);
    const mode = params.get('mode') || 'practice';
    const examId = params.get('exam');
    const exam = examId ? getExamById(examId) : null;

    document.getElementById('test-mode-label').textContent =
      mode === 'exam' ? 'Imtihon rejimi' : mode === 'challenge' ? 'Kunlik Challenge' : 'Mashq rejimi';

    const engine = startTestFromParams();
    engine.onUpdate = render;
    engine.onFinish = (result) => {
      sessionStorage.setItem('lastResult', JSON.stringify(result));
      location.href = 'results.html?id=' + result.id;
    };

    if (!engine.init()) {
      location.href = 'exams.html';
    }

    function render() {
      const q = engine.getCurrentQuestion();
      if (!q) return;

      const progress = engine.getProgress();
      document.getElementById('progress-fill').style.width = progress.percentage + '%';
      document.getElementById('progress-text').textContent = `${progress.current} / ${progress.total}`;
      document.getElementById('question-number').textContent = `Savol ${progress.current} / ${progress.total}`;
      document.getElementById('question-text').textContent = q.question;

      // Timer
      const timerEl = document.getElementById('timer-display');
      if (engine.duration > 0 || engine.timeLeft > 0) {
        timerEl.textContent = formatTime(engine.timeLeft);
        timerEl.classList.toggle('timer-warning', engine.timeLeft < 60);
      } else {
        timerEl.textContent = 'Vaqtsiz';
      }

      // Options
      const list = document.getElementById('options-list');
      const selected = engine.answers[q.id];
      list.innerHTML = q.options.map((opt, i) => {
        let cls = 'option-btn';
        if (selected === i) cls += ' selected';
        // Practice mode feedback
        if (mode === 'practice' && selected !== undefined) {
          if (i === q.correctAnswer) cls += ' correct';
          else if (i === selected) cls += ' wrong';
        }
        return `<button class="${cls}" data-index="${i}">${String.fromCharCode(65 + i)}) ${opt}</button>`;
      }).join('');

      list.querySelectorAll('.option-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          if (mode === 'exam' && engine.answers[q.id] !== undefined) return; // exam: no change after select? Allow change until finish
          engine.selectAnswer(parseInt(btn.dataset.index, 10));
          if (mode === 'practice') showFeedback(q, parseInt(btn.dataset.index, 10));
        });
      });

      // Feedback
      const feedback = document.getElementById('feedback-area');
      if (mode === 'practice' && selected !== undefined) {
        showFeedback(q, selected);
      } else {
        feedback.style.display = 'none';
      }

      // Nav buttons
      document.getElementById('prev-btn').disabled = engine.currentIndex === 0;
      document.getElementById('next-btn').textContent = engine.currentIndex === engine.questions.length - 1 ? 'Yakunlash' : 'Keyingi →';

      // Flag
      document.getElementById('flag-btn').classList.toggle('active', engine.flagged.has(q.id));

      // Question nav
      const nav = document.getElementById('question-nav');
      const status = engine.getAnsweredStatus();
      nav.innerHTML = status.map(s => {
        let cls = 'q-nav-btn';
        if (s.current) cls += ' current';
        if (s.answered) cls += ' answered';
        if (s.flagged) cls += ' flagged';
        return `<button class="${cls}" data-index="${s.index}">${s.index + 1}</button>`;
      }).join('');
      nav.querySelectorAll('.q-nav-btn').forEach(btn => {
        btn.addEventListener('click', () => engine.goTo(parseInt(btn.dataset.index, 10)));
      });

      document.getElementById('answered-count').textContent = progress.answered;
      document.getElementById('flagged-count').textContent = progress.flagged;
    }

    function showFeedback(q, selected) {
      const feedback = document.getElementById('feedback-area');
      const isCorrect = selected === q.correctAnswer;
      feedback.style.display = 'block';
      feedback.className = 'feedback-area ' + (isCorrect ? 'feedback-correct' : 'feedback-wrong');
      feedback.innerHTML = `
        <strong>${isCorrect ? '✓ To‘g‘ri!' : '✕ Noto‘g‘ri'}</strong>
        <p>${q.explanation || ''}</p>
      `;
    }

    document.getElementById('prev-btn').addEventListener('click', () => engine.prev());
    document.getElementById('next-btn').addEventListener('click', () => {
      if (engine.currentIndex === engine.questions.length - 1) {
        if (confirm('Testni yakunlashni xohlaysizmi?')) engine.finish();
      } else {
        engine.next();
      }
    });
    document.getElementById('flag-btn').addEventListener('click', () => engine.toggleFlag());
    document.getElementById('finish-btn').addEventListener('click', () => {
      if (confirm('Testni yakunlashni xohlaysizmi?')) engine.finish();
    });
    document.getElementById('finish-early-btn').addEventListener('click', () => {
      if (confirm('Testni yakunlashni xohlaysizmi?')) engine.finish();
    });
  </script>
</body>
</html>
